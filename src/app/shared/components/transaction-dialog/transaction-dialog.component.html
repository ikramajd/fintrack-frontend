<h2 mat-dialog-title>{{ data.transaction ? 'Edit' : 'Add' }} Transaction</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <!-- Type Toggle -->
    <div class="type-toggle">
      <button type="button" class="type-btn"
              [class.active-income]="form.get('type')?.value === 'INCOME'"
              (click)="form.get('type')?.setValue('INCOME')">
        <mat-icon>trending_up</mat-icon> Income
      </button>
      <button type="button" class="type-btn"
              [class.active-expense]="form.get('type')?.value === 'EXPENSE'"
              (click)="form.get('type')?.setValue('EXPENSE')">
        <mat-icon>trending_down</mat-icon> Expense
      </button>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="0.00" min="0" step="0.01" />
      <span matPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="categoryId">
        @for (cat of filteredCategories; track cat.id) {
          <mat-option [value]="cat.id">
            <span class="cat-option">
              <span class="cat-dot" [style.background]="cat.color"></span>
              {{ cat.name }}
            </span>
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" />
      <mat-datepicker-toggle matSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description (optional)</mat-label>
      <input matInput formControlName="description" placeholder="What was this for?" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="loading || form.invalid">
    {{ data.transaction ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
