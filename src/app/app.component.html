<!-- Barre de navigation : affichée uniquement si l'utilisateur est connecté -->
@if (auth.isLoggedIn()) {
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" routerLink="/dashboard">
      <i class="bi bi-wallet2 me-2"></i>FinTrack
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="bi bi-speedometer2 me-1"></i>Tableau de bord
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/transactions" routerLinkActive="active">
            <i class="bi bi-arrow-left-right me-1"></i>Transactions
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/categories" routerLinkActive="active">
            <i class="bi bi-tags me-1"></i>Catégories
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/goals" routerLinkActive="active">
            <i class="bi bi-bullseye me-1"></i>Objectifs
          </a>
        </li>
      </ul>

      <!-- Utilisateur connecté + déconnexion -->
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white-50">
          <i class="bi bi-person-circle me-1"></i>{{ auth.currentUser?.name }}
        </span>
        <button class="btn btn-sm btn-outline-light" (click)="auth.logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
        </button>
      </div>
    </div>
  </nav>
}

<!-- Conteneur centré pour les pages privées ; plein écran pour login/inscription -->
@if (auth.isLoggedIn()) {
  <main class="container py-4">
    <router-outlet />
  </main>
} @else {
  <router-outlet />
}
