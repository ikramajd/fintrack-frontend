<div class="auth-wrapper">
  <div class="card shadow-lg auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
        <h3 class="fw-bold mt-3 mb-1">Créer un compte</h3>
        <p class="text-muted">Commencez à suivre vos finances</p>
      </div>

      @if (error) {
        <div class="alert alert-danger py-2">{{ error }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" formControlName="name"
                 [class.is-invalid]="name.invalid && name.touched">
          <div class="invalid-feedback">Nom requis.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email"
                 [class.is-invalid]="email.invalid && email.touched" placeholder="vous@exemple.com">
          <div class="invalid-feedback">Email valide requis.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" formControlName="password"
                 [class.is-invalid]="password.invalid && password.touched">
          <div class="invalid-feedback">Au moins 4 caractères.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          {{ loading ? 'Création...' : 'Créer mon compte' }}
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Déjà un compte ?
        <a routerLink="/login" class="fw-semibold text-decoration-none">Se connecter</a>
      </p>
    </div>
  </div>
</div>
