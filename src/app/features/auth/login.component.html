<div class="auth-wrapper">
  <div class="card shadow-lg auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
        <h3 class="fw-bold mt-3 mb-1">FinTrack</h3>
        <p class="text-muted">Connectez-vous à votre espace</p>
      </div>

      @if (error) {
        <div class="alert alert-danger py-2">{{ error }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email"
                 [class.is-invalid]="email.invalid && email.touched" placeholder="vous@exemple.com">
          <div class="invalid-feedback">Email valide requis.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" formControlName="password"
                 [class.is-invalid]="password.invalid && password.touched">
          <div class="invalid-feedback">Mot de passe requis.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Pas encore de compte ?
        <a routerLink="/register" class="fw-semibold text-decoration-none">Créer un compte</a>
      </p>
      <p class="text-center small text-muted mt-3 mb-0">
        Démo : <code>demo&#64;fintrack.com</code> / <code>demo</code>
      </p>
    </div>
  </div>
</div>
